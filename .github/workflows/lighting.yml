# Photographs the areas lit by real light (LitSprites, SunLight) through the
# day, lit and unlit side by side, so the look can be judged on every pull
# request. The pictures are uploaded as an artifact and also pushed, as one
# throwaway commit, to the branch shots/<pull request branch>, where they can
# be fetched and looked at without downloading the artifact.
name: Lighting

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: lighting-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7"
  # every outdoor area, at dawn, noon, dusk and night
  REGIONS: ahwahnee_meadow,ahwahnee_trail,big_oak_flat_junction,bridalveil_fall,crane_flat,crows_camp,curry_village,el_capitan_meadow,el_portal,four_mile_trailhead,glacier_point,half_dome,happy_isles,housekeeping_camp,lamon_homestead,leidig_meadow,little_yosemite_valley,mirror_lake,tenaya_creek,the_ahwahnee,tunnel_view,tuolumne_meadows,upper_pines,wawona,yosemite_village
  HOURS: "6.75,12,19.5,22"

jobs:
  shots:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install xvfb and software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1 python3-pil

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Take the shots
        run: |
          mkdir -p /tmp/lit /tmp/unlit
          for season in 1; do
            for mode in lit unlit; do
              SHOT_DIR=/tmp/$mode SHOT_REGIONS=$REGIONS SHOT_HOURS=$HOURS SHOT_SEASON=$season \
                SHOT_PREFIX=s${season}_ SHOT_UNLIT=$([ $mode = unlit ] && echo 1 || echo 0) SHOT_RENDERER=forward_plus \
                xvfb-run -a -s "-screen 0 1920x1080x24" ~/godot/godot --path . --rendering-method forward_plus \
                res://tools/shots/renderer_tour.tscn 2>&1 | grep -E "^Renderer|ERROR|SCRIPT" | head -20
            done
          done
          python3 tools/shots/side_by_side.py /tmp/unlit /tmp/lit /tmp/shots

      - name: Upload pictures
        uses: actions/upload-artifact@v4
        with:
          name: lighting-shots
          path: /tmp/shots

      - name: Push the pictures to shots/${{ github.head_ref || github.ref_name }}
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd /tmp/shots
          git init -q
          git checkout -q -b shots
          git add .
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Lighting shots for ${{ github.event.pull_request.head.sha }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            "shots:refs/heads/shots/${{ github.head_ref }}"
