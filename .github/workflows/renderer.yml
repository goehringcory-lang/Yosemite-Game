# Takes a screenshot tour of the park under the Compatibility renderer and
# under Forward+ (tools/shots/renderer_compare.sh) and compares them, so a
# change to the renderer or the shaders can't quietly change how the game
# looks. The pictures and the differences are uploaded as an artifact.
name: Renderer

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: renderer-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7"

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # xvfb gives Godot a window; lavapipe (mesa-vulkan-drivers) is a
      # software Vulkan driver for Forward+, llvmpipe the OpenGL one.
      - name: Install xvfb and software graphics drivers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb libgl1-mesa-dri mesa-vulkan-drivers libvulkan1

      - name: Cache Godot
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-linux

      - name: Download Godot
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot

      - name: Import assets
        run: ~/godot/godot --headless --path . --import

      - name: Compare renderers
        run: GODOT=~/godot/godot tools/shots/renderer_compare.sh /tmp/renderer_compare

      - name: Upload pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: renderer-compare
          path: /tmp/renderer_compare
